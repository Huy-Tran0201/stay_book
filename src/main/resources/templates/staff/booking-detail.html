<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head('Chi tiết đặt phòng')}"></head>
<body>
<nav th:replace="~{layout/main :: header}"></nav>
<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Đặt phòng <span th:text="${booking.code}"></span></h1>
    <a class="btn btn-outline-secondary" th:href="@{/staff/bookings}">Danh sách</a>
  </div>
  <div th:replace="~{layout/main :: flash}"></div>

  <div class="row g-3">
    <div class="col-lg-7">
      <div class="card mb-3"><div class="card-body">
        <h2 class="h5">Thông tin khách</h2>
        <dl class="row mb-0">
          <dt class="col-sm-4">Tên khách</dt><dd class="col-sm-8" th:text="${booking.guestName}"></dd>
          <dt class="col-sm-4">Số điện thoại</dt><dd class="col-sm-8" th:text="${booking.guestPhone}"></dd>
          <dt class="col-sm-4">Email</dt><dd class="col-sm-8" th:text="${booking.guestEmail ?: 'Không có'}"></dd>
          <dt class="col-sm-4">Số khách</dt><dd class="col-sm-8" th:text="${booking.guestCount}"></dd>
          <dt class="col-sm-4">Loại phòng</dt><dd class="col-sm-8" th:text="${booking.roomType.name}"></dd>
          <dt class="col-sm-4">Phòng</dt><dd class="col-sm-8" th:text="${booking.room.roomNumber}"></dd>
          <dt class="col-sm-4">Ngày ở</dt><dd class="col-sm-8" th:text="${#temporals.format(booking.checkInDate, 'dd/MM/yyyy') + ' - ' + #temporals.format(booking.checkOutDate, 'dd/MM/yyyy')}"></dd>
          <dt class="col-sm-4">Trạng thái</dt><dd class="col-sm-8"><span th:replace="~{fragments/status-badge :: statusBadge(${booking.status})}"></span></dd>
        </dl>
      </div></div>

      <div class="card mb-3"><div class="card-body">
        <h2 class="h5">Các đêm</h2>
        <table class="table table-sm mb-0"><tbody>
          <tr th:each="night : ${nights}">
            <td th:text="${#temporals.format(night.date, 'dd/MM/yyyy')}"></td>
            <td class="text-end" th:text="${#numbers.formatInteger(night.price, 1, 'POINT') + ' ₫'}"></td>
          </tr>
        </tbody></table>
      </div></div>

      <div class="card mb-3"><div class="card-body">
        <h2 class="h5">Lịch sử chuyển trạng thái</h2>
        <table class="table table-sm mb-0"><tbody>
          <tr th:each="event : ${events}">
            <td th:text="${#temporals.format(event.at, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${event.actor}"></td>
            <td th:text="${event.reason}"></td>
            <td><span th:if="${event.fromStatus != null}" th:text="${event.fromStatus} + ' → '"></span><strong th:text="${event.toStatus}"></strong></td>
          </tr>
        </tbody></table>
      </div></div>
    </div>

    <div class="col-lg-5">
      <div class="card mb-3"><div class="card-body">
        <h2 class="h5">Thanh toán</h2>
        <p class="mb-1">Tiền cọc: <strong th:text="${#numbers.formatInteger(booking.depositAmount, 1, 'POINT') + ' ₫'}"></strong></p>
        <p class="mb-1">Đã thanh toán: <strong th:text="${#numbers.formatInteger(ledger.paid, 1, 'POINT') + ' ₫'}"></strong></p>
        <p class="mb-1">Tổng phải thu: <strong th:text="${#numbers.formatInteger(ledger.totalDue, 1, 'POINT') + ' ₫'}"></strong></p>
        <p class="mb-3">Còn lại: <strong th:text="${#numbers.formatInteger(ledger.remaining, 1, 'POINT') + ' ₫'}"></strong></p>
        <table class="table table-sm mb-0"><tbody>
          <tr th:each="payment : ${payments}">
            <td th:text="${payment.type}"></td>
            <td th:text="${payment.method}"></td>
            <td th:text="${#temporals.format(payment.recordedAt, 'dd/MM/yyyy HH:mm')}"></td>
            <td class="text-end" th:text="${#numbers.formatInteger(payment.amount, 1, 'POINT') + ' ₫'}"></td>
          </tr>
        </tbody></table>
        <p th:if="${ledger.refundDue > 0}" class="alert alert-warning mt-3 mb-0">
          Còn phải hoàn <strong th:text="${#numbers.formatInteger(ledger.refundDue, 1, 'POINT') + ' ₫'}"></strong>.
        </p>
      </div></div>

      <div class="card" th:if="${booking.status.name() == 'PENDING_DEPOSIT' or booking.status.name() == 'AWAITING_CONFIRMATION'}">
        <div class="card-body">
          <h2 class="h5">Xác nhận tiền cọc</h2>
          <form th:action="@{/staff/bookings/{code}/confirm-deposit(code=${booking.code})}" method="post" class="mb-3">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label class="form-label">Số tiền thực nhận</label>
            <input class="form-control mb-2" type="number" name="amount" min="1" required th:value="${booking.depositAmount}">
            <label class="form-label">Hình thức</label>
            <select class="form-select mb-3" name="method">
              <option value="BANK_TRANSFER">Chuyển khoản</option>
              <option value="CASH">Tiền mặt</option>
            </select>
            <button class="btn btn-primary btn-lg w-100" type="submit">Xác nhận cọc</button>
          </form>
          <form th:action="@{/staff/bookings/{code}/reject-deposit(code=${booking.code})}" method="post"
                th:attr="data-confirm='Bạn chắc chắn muốn từ chối tiền cọc? Đặt phòng sẽ bị hủy.'"
                onsubmit="return confirm(this.dataset.confirm)">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label class="form-label">Lý do từ chối</label>
            <input class="form-control mb-2" name="reason" maxlength="500" value="Thông tin chuyển khoản không khớp">
            <button class="btn btn-danger w-100" type="submit">Từ chối cọc</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>
<footer th:replace="~{layout/main :: footer}"></footer>
</body>
</html>
