<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head('Hồ sơ')}"></head><body>
<nav th:replace="~{layout/main :: header}"></nav><main class="container py-5"><div class="card mx-auto" style="max-width:520px"><div class="card-body">
<h1 class="h3">Hồ sơ</h1><div class="alert alert-success" th:if="${param.saved}">Đã cập nhật hồ sơ.</div>
<div class="alert alert-danger" th:if="${formError}" th:text="${formError}"></div>
<form th:action="@{/profile}" th:object="${form}" method="post">
<label class="form-label">Họ tên</label><input class="form-control mb-2" th:field="*{fullName}">
<label class="form-label">Số điện thoại</label><input class="form-control mb-2" th:field="*{phone}">
<div class="text-danger" th:errors="*{phone}"></div>
<hr><label class="form-label">Mật khẩu hiện tại (khi đổi mật khẩu)</label><input class="form-control mb-2" type="password" th:field="*{currentPassword}">
<label class="form-label">Mật khẩu mới</label><input class="form-control mb-3" type="password" th:field="*{newPassword}">
<div class="text-danger" th:errors="*{newPassword}"></div><button class="btn btn-primary">Lưu thay đổi</button>
</form></div></div></main><footer th:replace="~{layout/main :: footer}"></footer></body></html>
