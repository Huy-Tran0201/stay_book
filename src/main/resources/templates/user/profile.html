<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head('Hồ sơ cá nhân')}"></head>
<body>
<nav th:replace="~{layout/main :: header}"></nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-7 col-lg-6">
            <div class="card p-4 p-md-4 border-0 shadow-sm" style="border: 1px solid var(--sb-border) !important;">
                <h1 class="h4 fw-bold text-dark mb-1">Hồ sơ cá nhân</h1>
                <p class="text-muted small mb-4">Cập nhật thông tin liên hệ và quản lý bảo mật tài khoản</p>

                <div class="alert alert-success border-0 small py-2 mb-3" th:if="${param.saved}">✓ Đã lưu thay đổi hồ sơ thành công.</div>
                <div class="alert alert-danger border-0 small py-2 mb-3" th:if="${formError}" th:text="${formError}"></div>

                <form th:action="@{/profile}" th:object="${form}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    
                    <div class="mb-3">
                        <label class="form-label" for="fullName">Họ và tên</label>
                        <input class="form-control" id="fullName" th:field="*{fullName}" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label" for="phone">Số điện thoại</label>
                        <input class="form-control" id="phone" th:field="*{phone}" required>
                        <div class="text-danger small mt-1" th:errors="*{phone}"></div>
                    </div>

                    <div class="p-3 bg-light rounded-3 mb-3 border">
                        <h2 class="h6 fw-bold text-dark mb-1">Đổi mật khẩu</h2>
                        <p class="small text-muted mb-3">Chỉ điền vào các ô dưới nếu bạn muốn thay đổi mật khẩu đăng nhập.</p>

                        <div class="mb-3">
                            <label class="form-label small" for="currentPassword">Mật khẩu hiện tại</label>
                            <input class="form-control" id="currentPassword" type="password" th:field="*{currentPassword}" placeholder="Nhập mật khẩu cũ">
                        </div>

                        <div class="mb-2">
                            <label class="form-label small" for="newPassword">Mật khẩu mới</label>
                            <input class="form-control" id="newPassword" type="password" th:field="*{newPassword}" placeholder="Tối thiểu 8 ký tự">
                            <div class="text-danger small mt-1" th:errors="*{newPassword}"></div>
                        </div>
                    </div>

                    <button class="btn btn-primary w-100 py-2 fw-semibold" type="submit">Lưu thay đổi</button>
                </form>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout/main :: footer}"></footer>
</body>
</html>
