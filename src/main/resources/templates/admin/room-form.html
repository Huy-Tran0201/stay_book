<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head('Thông tin phòng')}"></head>
<body>
<nav th:replace="~{layout/main :: header}"></nav>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="card p-4 p-md-4 border-0 shadow-sm" style="border: 1px solid var(--sb-border) !important;">
                <h1 class="h4 fw-bold text-dark mb-3" th:text="${id == null ? 'Thêm phòng mới' : 'Cập nhật thông tin phòng'}"></h1>

                <form th:action="@{/admin/rooms/save}" th:object="${form}" method="post" class="row g-3">
                    <input type="hidden" name="id" th:value="${id}"/>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <div th:if="${#fields.hasGlobalErrors()}" class="col-12">
                        <div class="alert alert-danger border-0 small py-2">
                            <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
                            <div th:if="${affectedBookings}">
                                Booking bị ảnh hưởng: <span th:each="b : ${affectedBookings}" th:text="${b.code} + ' '"></span>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="roomNumber">Số phòng</label>
                        <input class="form-control" id="roomNumber" th:field="*{roomNumber}" placeholder="Ví dụ: 101, 202" required/>
                        <div class="text-danger small mt-1" th:errors="*{roomNumber}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="floor">Tầng</label>
                        <input type="number" class="form-control" id="floor" th:field="*{floor}" placeholder="Ví dụ: 1, 2" required/>
                        <div class="text-danger small mt-1" th:errors="*{floor}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="roomTypeId">Loại phòng</label>
                        <select class="form-select" id="roomTypeId" th:field="*{roomTypeId}" required>
                            <option value="">-- Chọn loại phòng --</option>
                            <option th:each="t : ${roomTypes}" th:value="${t.id}" th:text="${t.name}"></option>
                        </select>
                        <div class="text-danger small mt-1" th:errors="*{roomTypeId}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="status">Trạng thái phòng</label>
                        <select class="form-select" id="status" th:field="*{status}">
                            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                        </select>
                    </div>

                    <div class="col-12 pt-3 border-top d-flex gap-2">
                        <button class="btn btn-primary px-4 fw-semibold" type="submit">Lưu phòng</button>
                        <a class="btn btn-outline-secondary px-3" th:href="@{/admin/rooms}">Hủy bỏ</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout/main :: footer}"></footer>
</body>
</html>
