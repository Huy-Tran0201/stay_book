<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head('Quản lý loại phòng')}"></head>
<body>
<nav th:replace="~{layout/main :: header}"></nav>

<main class="container py-4">
    <div th:replace="~{layout/main :: flash}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 fw-bold mb-1 text-dark">Quản lý loại phòng</h1>
            <p class="text-muted small mb-0">Cấu hình danh mục loại phòng, định mức giá và tiện nghi</p>
        </div>
        <a class="btn btn-primary btn-sm px-3 shadow-sm" th:href="@{/admin/room-types/new}">+ Thêm loại phòng mới</a>
    </div>

    <div class="card border-0 shadow-sm" style="border: 1px solid var(--sb-border) !important;">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th>Tên loại phòng</th>
                        <th>Sức chứa</th>
                        <th>Giá cơ bản</th>
                        <th>Trạng thái</th>
                        <th class="text-end">Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="type : ${roomTypes}">
                        <td><strong class="text-dark" th:text="${type.name}"></strong></td>
                        <td class="text-secondary" th:text="${type.maxGuests} + ' khách'"></td>
                        <td>
                            <strong class="text-primary" th:text="${#numbers.formatDecimal(type.basePrice, 1, 'POINT', 0, 'COMMA') + ' ₫'}"></strong>
                        </td>
                        <td>
                            <span th:if="${type.status.name() == 'ACTIVE'}" class="badge-soft badge-soft-success">Đang hoạt động</span>
                            <span th:if="${type.status.name() == 'INACTIVE'}" class="badge-soft badge-soft-secondary">Ngừng hoạt động</span>
                        </td>
                        <td class="text-end">
                            <a class="btn btn-sm btn-outline-primary me-1" th:href="@{/admin/room-types/{id}/edit(id=${type.id})}">Sửa</a>
                            <form class="d-inline" th:if="${type.status.name() == 'ACTIVE'}" th:action="@{/admin/room-types/{id}/deactivate(id=${type.id})}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button class="btn btn-sm btn-outline-danger" type="submit">Ngừng HĐ</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(roomTypes)}">
                        <td colspan="5" class="text-center text-muted py-5">Chưa có loại phòng. Hãy thêm loại phòng đầu tiên.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{layout/main :: footer}"></footer>
</body>
</html>
