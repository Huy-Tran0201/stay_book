<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head('Đặt phòng của tôi')}"></head>
<body>
<nav th:replace="~{layout/main :: header}"></nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 fw-bold mb-1">Lịch sử đặt phòng</h1>
            <p class="text-muted small mb-0">Theo dõi trạng thái, chi tiết thanh toán và quản lý các chuyến đi của bạn</p>
        </div>
        <a class="btn btn-primary btn-sm px-3" th:href="@{/}">
            + Đặt phòng mới
        </a>
    </div>

    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(bookings)}" class="card p-5 text-center border-0 shadow-sm my-4" style="border: 1px solid var(--sb-border) !important;">
        <div class="text-muted mb-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        </div>
        <h2 class="h5 fw-bold" th:text="#{booking.empty.title}">Bạn chưa có đặt phòng nào.</h2>
        <div class="mt-3">
            <a class="btn btn-primary" th:href="@{/}" th:text="#{booking.empty.action}">Tìm phòng ngay</a>
        </div>
    </div>

    <!-- Bookings List -->
    <div th:unless="${#lists.isEmpty(bookings)}" class="row g-3">
        <div class="col-12" th:each="booking : ${bookings}">
            <div class="card p-3 p-md-4 border-0 shadow-sm"
                 style="border: 1px solid var(--sb-border) !important; color: inherit;">
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
                    <div>
                        <div class="d-flex align-items-center gap-2 mb-1">
                            <a th:href="@{/my-bookings/{code}(code=${booking.code})}"
                               class="fw-bold text-primary font-monospace text-decoration-none" th:text="${booking.code}"></a>
                            <span class="badge-soft badge-soft-secondary" th:text="${booking.roomType.name}"></span>
                        </div>
                        <div class="small text-muted">
                            <span th:text="${#temporals.format(booking.checkInDate, 'dd/MM/yyyy')}"></span>
                            → <span th:text="${#temporals.format(booking.checkOutDate, 'dd/MM/yyyy')}"></span>
                            • <span th:text="${booking.guestCount}"></span> khách
                        </div>
                    </div>
                    <div class="d-flex align-items-center gap-3">
                        <div class="text-end d-none d-sm-block">
                            <span class="small text-muted d-block">Tổng tiền</span>
                            <strong class="text-dark" th:text="${#numbers.formatDecimal(booking.totalRoomAmount, 1, 'POINT', 0, 'COMMA') + ' ₫'}"></strong>
                        </div>
                        <span th:replace="~{fragments/status-badge :: statusBadge(${booking.status})}"></span>
                        <a th:href="@{/my-bookings/{code}(code=${booking.code})}" class="btn btn-sm btn-outline-secondary" title="Xem chi tiết">
                            Chi tiết
                        </a>
                    </div>
                </div>

                <div th:if="${booking.status.name() == 'EXPIRED'}" class="alert alert-warning border-0 mt-3 mb-0 d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <span class="text-danger fw-semibold" th:text="#{booking.expired.notice}">Đặt phòng đã hết hạn giữ chỗ. Vui lòng đặt lại.</span>
                    <a th:href="@{/booking/new(roomTypeId=${booking.roomType.id},checkIn=${booking.checkInDate},checkOut=${booking.checkOutDate},guests=${booking.guestCount})}"
                       class="btn btn-sm btn-danger" th:text="#{booking.rebook}">Đặt lại</a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout/main :: footer}"></footer>
</body>
</html>
