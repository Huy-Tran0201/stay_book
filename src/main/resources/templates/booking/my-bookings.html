<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head('Đặt phòng của tôi')}"></head>
<body><nav th:replace="~{layout/main :: header}"></nav><main class="container py-4">
  <h1 class="h3 mb-3">Đặt phòng của tôi</h1>
  <div th:if="${#lists.isEmpty(bookings)}">
    <div class="alert alert-light border">
      <p th:text="#{booking.empty.title}"></p>
      <a class="btn btn-primary" th:href="@{/}" th:text="#{booking.empty.action}"></a>
    </div>
  </div>
  <div th:unless="${#lists.isEmpty(bookings)}" class="list-group">
    <a th:each="booking : ${bookings}" th:href="@{/my-bookings/{code}(code=${booking.code})}"
       class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
      <span>
        <strong th:text="${booking.code}"></strong>
        <span class="d-block text-muted" th:text="${booking.checkInDate + ' - ' + booking.checkOutDate}"></span>
      </span>
      <span th:replace="~{fragments/status-badge :: statusBadge(${booking.status})}"></span>
    </a>
  </div>
</main><footer th:replace="~{layout/main :: footer}"></footer></body></html>
