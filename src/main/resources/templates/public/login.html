<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head('Đăng nhập')}"></head>
<body>
<nav th:replace="~{layout/main :: header}"></nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5 col-xl-4">
            <div class="card p-4 p-md-4 border-0 shadow-sm" style="border: 1px solid var(--sb-border) !important;">
                <div class="text-center mb-4">
                    <h1 class="h4 fw-bold text-dark">Đăng nhập StayBook</h1>
                    <p class="text-muted small">Chào mừng bạn quay trở lại với hệ thống</p>
                </div>

                <div th:if="${param.registered}" class="alert alert-success border-0 small py-2">Đăng ký thành công. Vui lòng đăng nhập.</div>
                <div th:if="${param.reset}" class="alert alert-success border-0 small py-2">Đổi mật khẩu thành công.</div>
                <div th:if="${param.error}" class="alert alert-danger border-0 small py-2">Email hoặc mật khẩu không chính xác.</div>
                <div th:if="${param.locked}" class="alert alert-danger border-0 small py-2">Tài khoản đã bị khóa. Vui lòng liên hệ cơ sở.</div>
                <div th:if="${param.logout}" class="alert alert-success border-0 small py-2">Bạn đã đăng xuất an toàn.</div>

                <form th:action="@{/login}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="mb-3">
                        <label class="form-label" for="username">Địa chỉ Email</label>
                        <input class="form-control" id="username" name="username" type="email" placeholder="email@example.com" required autofocus>
                    </div>
                    <div class="mb-3">
                        <div class="d-flex justify-content-between">
                            <label class="form-label" for="password">Mật khẩu</label>
                            <a th:href="@{/forgot-password}" class="small text-muted text-decoration-none">Quên mật khẩu?</a>
                        </div>
                        <input class="form-control" id="password" name="password" type="password" placeholder="Nhập mật khẩu" required>
                    </div>
                    <button class="btn btn-primary w-100 py-2 fw-semibold mt-2" type="submit">Đăng nhập</button>
                </form>

                <div class="mt-4 pt-3 border-top text-center">
                    <span class="small text-muted">Chưa có tài khoản?</span>
                    <a th:href="@{/register}" class="small fw-semibold text-primary text-decoration-none ms-1">Đăng ký ngay</a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout/main :: footer}"></footer>
</body>
</html>
