<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head('Phòng còn trống')}"></head>
<body>
<nav th:replace="~{layout/main :: header}"></nav>

<main class="container py-4">
    <!-- Header info -->
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
        <div>
            <h1 class="h3 fw-bold mb-1">Kết quả tìm phòng</h1>
            <p class="text-muted small mb-0">
                Từ ngày <strong th:text="${checkIn}"></strong> đến ngày <strong th:text="${checkOut}"></strong>
                • <span th:text="${guests}"></span> khách
            </p>
        </div>
        <button class="btn btn-outline-secondary btn-sm d-md-none" type="button" data-bs-toggle="collapse" data-bs-target="#filterPanel">
            Bộ lọc & Tìm kiếm
        </button>
    </div>

    <!-- Filter Form -->
    <section class="card mb-4 shadow-sm border-0 collapse d-md-block" id="filterPanel" style="border: 1px solid var(--sb-border) !important;">
        <div class="card-body p-3 p-md-4">
            <form method="get" th:action="@{/rooms}" class="row g-3">
                <div class="col-6 col-md-3">
                    <label class="form-label" for="checkIn">Ngày nhận</label>
                    <input class="form-control" id="checkIn" name="checkIn" type="date" th:value="${checkIn}" required>
                </div>
                <div class="col-6 col-md-3">
                    <label class="form-label" for="checkOut">Ngày trả</label>
                    <input class="form-control" id="checkOut" name="checkOut" type="date" th:value="${checkOut}" required>
                </div>
                <div class="col-6 col-md-2">
                    <label class="form-label" for="guests">Số khách</label>
                    <input class="form-control" id="guests" name="guests" type="number" min="1" max="10" th:value="${guests}" required>
                </div>
                <div class="col-6 col-md-4">
                    <label class="form-label" for="sort">Sắp xếp theo</label>
                    <select class="form-select" id="sort" name="sort">
                        <option value="priceAsc" th:selected="${sort == 'priceAsc'}">Giá tăng dần</option>
                        <option value="priceDesc" th:selected="${sort == 'priceDesc'}">Giá giảm dần</option>
                        <option value="capacity" th:selected="${sort == 'capacity'}">Sức chứa nhiều nhất</option>
                    </select>
                </div>

                <div class="col-6 col-md-4">
                    <label class="form-label" for="minPrice">Giá tối thiểu (₫)</label>
                    <input class="form-control" id="minPrice" name="minPrice" type="number" min="0" placeholder="Từ" th:value="${minPrice}">
                </div>
                <div class="col-6 col-md-4">
                    <label class="form-label" for="maxPrice">Giá tối đa (₫)</label>
                    <input class="form-control" id="maxPrice" name="maxPrice" type="number" min="0" placeholder="Đến" th:value="${maxPrice}">
                </div>
                <div class="col-12 col-md-4">
                    <label class="form-label" for="minCapacity">Sức chứa tối thiểu (khách)</label>
                    <input class="form-control" id="minCapacity" name="minCapacity" type="number" min="1" placeholder="Số người tối thiểu" th:value="${minCapacity}">
                </div>

                <div class="col-12">
                    <label class="form-label d-block">Tiện nghi mong muốn</label>
                    <div class="d-flex flex-wrap gap-3">
                        <label th:each="amenity : ${amenities}" class="form-check form-check-inline m-0">
                            <input class="form-check-input" type="checkbox" name="amenity" th:value="${amenity.id}"
                                   th:checked="${selectedAmenities != null and selectedAmenities.contains(amenity.id)}">
                            <span class="form-check-label small" th:text="${amenity.name}"></span>
                        </label>
                    </div>
                </div>

                <div class="col-12 text-end pt-2">
                    <button class="btn btn-primary px-4" type="submit">Cập nhật kết quả</button>
                </div>
            </form>
        </div>
    </section>

    <!-- Error / Empty Alerts -->
    <div th:if="${validationMessage}" class="alert alert-danger border-0 shadow-sm" th:text="${validationMessage}"></div>
    <div th:if="${validationMessage == null && #lists.isEmpty(results)}" class="card p-5 text-center border-0 shadow-sm my-4" style="border: 1px solid var(--sb-border) !important;">
        <div class="text-muted mb-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="8" y1="12" x2="16" y2="12"></line></svg>
        </div>
        <h2 class="h5 fw-bold" th:text="#{search.no-results}">Không còn phòng phù hợp trong các ngày bạn chọn.</h2>
        <p class="text-muted small mb-0" th:text="#{search.no-results.hint}">Vui lòng thử đổi ngày hoặc giảm số khách.</p>
    </div>

    <!-- Room Results List -->
    <div class="row g-4" th:if="${!#lists.isEmpty(results)}">
        <article class="col-12 col-md-6 col-lg-4" th:each="result : ${results}">
            <div class="card h-100 card-hover border-0 shadow-sm" style="border: 1px solid var(--sb-border) !important;">
                <div class="position-relative">
                    <img class="room-card-img" th:if="${result.imageFileName}"
                         th:src="@{'/uploads/' + ${result.imageFileName}}" th:alt="${result.roomType.name}">
                    <div class="room-card-img-placeholder" th:unless="${result.imageFileName}">
                        <span>StayBook Room</span>
                    </div>
                    <span class="position-absolute top-0 end-0 m-2 badge-soft badge-soft-success shadow-sm" style="background:#ffffff; border-color:var(--sb-border)">
                        Còn <strong th:text="${result.availableRoomCount}"></strong> phòng
                    </span>
                </div>
                <div class="card-body d-flex flex-column p-4">
                    <div class="d-flex justify-content-between align-items-baseline mb-1">
                        <h2 class="h5 fw-bold mb-0 text-dark" th:text="${result.roomType.name}">Loại phòng</h2>
                        <span class="small text-muted" th:text="${result.roomType.maxGuests} + ' khách'"></span>
                    </div>
                    <p class="text-muted small flex-grow-1 mb-3" style="line-height: 1.5;" th:text="${result.roomType.description}"></p>
                    
                    <div class="d-flex flex-wrap gap-1 mb-3" th:if="${!#lists.isEmpty(result.roomType.amenities)}">
                        <span class="amenity-tag" th:each="amenity : ${result.roomType.amenities}"
                              th:text="${amenity.name}"></span>
                    </div>

                    <div class="pt-3 border-top mt-auto">
                        <div class="d-flex justify-content-between align-items-end mb-3">
                            <div>
                                <span class="small text-muted d-block">Giá trung bình:</span>
                                <span class="small fw-semibold text-secondary" th:text="${#numbers.formatInteger(result.averageNightPrice, 3, 'POINT')} + ' ₫ / đêm'"></span>
                            </div>
                            <div class="text-end">
                                <span class="small text-muted d-block">Tổng kỳ ở:</span>
                                <span class="h5 fw-bold mb-0 text-primary" th:text="${#numbers.formatInteger(result.totalPrice, 3, 'POINT')} + ' ₫'"></span>
                            </div>
                        </div>
                        <a class="btn btn-primary w-100 py-2"
                           th:href="@{/room-types/{id}(id=${result.roomType.id},checkIn=${checkIn},checkOut=${checkOut},guests=${guests},minPrice=${minPrice},maxPrice=${maxPrice},minCapacity=${minCapacity},amenity=${selectedAmenities},sort=${sort})}">
                            Xem chi tiết & Đặt phòng
                        </a>
                    </div>
                </div>
            </div>
        </article>
    </div>
</main>

<footer th:replace="~{layout/main :: footer}"></footer>
</body>
</html>
