<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head('Phòng còn trống')}"></head>
<body>
<nav th:replace="~{layout/main :: header}"></nav>
<main class="container py-4">
    <h1 class="h2">Phòng còn trống</h1>
    <form class="row g-2 bg-white rounded-3 shadow-sm p-3 mb-4" method="get" th:action="@{/rooms}">
        <div class="col-6 col-md-2"><label class="form-label" for="checkIn">Nhận</label>
            <input class="form-control" id="checkIn" name="checkIn" type="date" th:value="${checkIn}" required></div>
        <div class="col-6 col-md-2"><label class="form-label" for="checkOut">Trả</label>
            <input class="form-control" id="checkOut" name="checkOut" type="date" th:value="${checkOut}" required></div>
        <div class="col-6 col-md-1"><label class="form-label" for="guests">Khách</label>
            <input class="form-control" id="guests" name="guests" type="number" min="1" th:value="${guests}" required></div>
        <div class="col-6 col-md-2"><label class="form-label" for="minPrice">Giá từ</label>
            <input class="form-control" id="minPrice" name="minPrice" type="number" min="0" th:value="${minPrice}"></div>
        <div class="col-6 col-md-2"><label class="form-label" for="maxPrice">Giá đến</label>
            <input class="form-control" id="maxPrice" name="maxPrice" type="number" min="0" th:value="${maxPrice}"></div>
        <div class="col-6 col-md-2"><label class="form-label" for="minCapacity">Sức chứa tối thiểu</label>
            <input class="form-control" id="minCapacity" name="minCapacity" type="number" min="1"
                   th:value="${minCapacity}"></div>
        <div class="col-6 col-md-2"><label class="form-label" for="sort">Sắp xếp</label>
            <select class="form-select" id="sort" name="sort">
                <option value="priceAsc" th:selected="${sort == 'priceAsc'}">Giá tăng dần</option>
                <option value="priceDesc" th:selected="${sort == 'priceDesc'}">Giá giảm dần</option>
                <option value="capacity" th:selected="${sort == 'capacity'}">Sức chứa</option>
            </select></div>
        <div class="col-12"><span class="form-label d-block">Tiện nghi</span>
            <div class="d-flex flex-wrap gap-3">
                <label th:each="amenity : ${amenities}" class="form-check">
                    <input class="form-check-input" type="checkbox" name="amenity" th:value="${amenity.id}"
                           th:checked="${selectedAmenities.contains(amenity.id)}">
                    <span class="form-check-label" th:text="${amenity.name}"></span>
                </label>
            </div>
        </div>
        <div class="col-12"><button class="btn btn-primary" type="submit">Cập nhật kết quả</button></div>
    </form>
    <div th:if="${validationMessage}" class="alert alert-danger" th:text="${validationMessage}"></div>
    <div th:if="${validationMessage == null && #lists.isEmpty(results)}" class="alert alert-info">
        <strong th:text="#{search.no-results}">Không còn phòng phù hợp trong các ngày bạn chọn.</strong>
        <div th:text="#{search.no-results.hint}">Vui lòng thử đổi ngày hoặc giảm số khách.</div>
    </div>
    <div class="row g-3" th:if="${!#lists.isEmpty(results)}">
        <article class="col-12 col-md-6 col-lg-4" th:each="result : ${results}">
            <div class="card h-100 shadow-sm">
                <img class="card-img-top" th:if="${result.imageFileName}"
                     th:src="@{'/uploads/' + result.imageFileName}" th:alt="${result.roomType.name}">
                <div class="card-body">
                    <h2 class="h5" th:text="${result.roomType.name}">Loại phòng</h2>
                    <p class="text-secondary" th:text="${result.roomType.description}"></p>
                    <p class="mb-1">Còn <strong th:text="${result.availableRoomCount}"></strong> phòng</p>
                    <p class="mb-1">Sức chứa: <span th:text="${result.roomType.maxGuests}"></span> khách</p>
                    <p class="mb-2">
                        <span class="badge text-bg-light border me-1" th:each="amenity : ${result.roomType.amenities}"
                              th:text="${amenity.name}"></span>
                    </p>
                    <p class="mb-1">Giá trung bình: <strong th:text="${#numbers.formatInteger(result.averageNightPrice, 3, 'POINT')} + ' ₫'"></strong>/đêm</p>
                    <p class="fw-bold">Tổng kỳ ở: <span th:text="${#numbers.formatInteger(result.totalPrice, 3, 'POINT')} + ' ₫'"></span></p>
                    <a class="btn btn-outline-primary"
                       th:href="@{/room-types/{id}(id=${result.roomType.id},checkIn=${checkIn},checkOut=${checkOut},guests=${guests},minPrice=${minPrice},maxPrice=${maxPrice},minCapacity=${minCapacity},amenity=${selectedAmenities},sort=${sort})}">
                        Xem chi tiết
                    </a>
                </div>
            </div>
        </article>
    </div>
</main>
<footer th:replace="~{layout/main :: footer}"></footer>
</body>
</html>
