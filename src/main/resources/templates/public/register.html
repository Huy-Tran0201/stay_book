<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head('Đăng ký')}"></head>
<body>
<nav th:replace="~{layout/main :: header}"></nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-7 col-lg-6 col-xl-5">
            <div class="card p-4 p-md-4 border-0 shadow-sm" style="border: 1px solid var(--sb-border) !important;">
                <div class="text-center mb-4">
                    <h1 class="h4 fw-bold text-dark">Tạo tài khoản StayBook</h1>
                    <p class="text-muted small">Đăng ký để đặt phòng và theo dõi tình trạng dễ dàng</p>
                </div>

                <div class="alert alert-danger border-0 small py-2" th:if="${formError}" th:text="${formError}"></div>

                <form th:action="@{/register}" th:object="${form}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    
                    <div class="mb-3">
                        <label class="form-label" for="fullName">Họ và tên</label>
                        <input class="form-control" id="fullName" th:field="*{fullName}" placeholder="Nguyễn Văn A" required>
                        <div class="text-danger small mt-1" th:errors="*{fullName}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="email">Địa chỉ Email</label>
                        <input class="form-control" id="email" type="email" th:field="*{email}" placeholder="email@example.com" required>
                        <div class="text-danger small mt-1" th:errors="*{email}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="phone">Số điện thoại</label>
                        <input class="form-control" id="phone" th:field="*{phone}" placeholder="0901234567" required>
                        <div class="text-danger small mt-1" th:errors="*{phone}"></div>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label class="form-label" for="password">Mật khẩu</label>
                            <input class="form-control" id="password" type="password" th:field="*{password}" placeholder="Tối thiểu 8 ký tự" required>
                            <div class="text-danger small mt-1" th:errors="*{password}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="confirmPassword">Nhập lại mật khẩu</label>
                            <input class="form-control" id="confirmPassword" type="password" th:field="*{confirmPassword}" placeholder="Khớp mật khẩu" required>
                        </div>
                    </div>

                    <button class="btn btn-primary w-100 py-2 fw-semibold mt-2" type="submit">Đăng ký tài khoản</button>
                </form>

                <div class="mt-4 pt-3 border-top text-center">
                    <span class="small text-muted">Đã có tài khoản?</span>
                    <a th:href="@{/login}" class="small fw-semibold text-primary text-decoration-none ms-1">Đăng nhập</a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout/main :: footer}"></footer>
</body>
</html>
