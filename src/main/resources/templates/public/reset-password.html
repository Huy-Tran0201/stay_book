<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head('Đặt lại mật khẩu')}"></head><body>
<nav th:replace="~{layout/main :: header}"></nav><main class="container py-5"><div class="card mx-auto" style="max-width:420px"><div class="card-body">
<h1 class="h3">Đặt lại mật khẩu</h1><div class="alert alert-danger" th:if="${param.invalid}">Liên kết không hợp lệ hoặc đã hết hạn.</div>
<form method="post"><input type="hidden" name="token" th:value="${token}"><label class="form-label">Mật khẩu mới</label>
<input class="form-control mb-3" type="password" name="password" minlength="8" required><button class="btn btn-primary">Đặt lại</button></form>
</div></div></main><footer th:replace="~{layout/main :: footer}"></footer></body></html>
