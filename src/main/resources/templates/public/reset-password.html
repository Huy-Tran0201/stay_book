<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head('Đặt lại mật khẩu')}"></head>
<body>
<nav th:replace="~{layout/main :: header}"></nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5 col-xl-4">
            <div class="card p-4 p-md-4 border-0 shadow-sm" style="border: 1px solid var(--sb-border) !important;">
                <div class="text-center mb-4">
                    <h1 class="h4 fw-bold text-dark">Đặt lại mật khẩu</h1>
                    <p class="text-muted small">Nhập mật khẩu mới cho tài khoản của bạn</p>
                </div>

                <div class="alert alert-danger border-0 small py-2 mb-3" th:if="${param.invalid}">
                    Liên kết không hợp lệ hoặc đã hết hạn (sau 30 phút).
                </div>

                <form method="post" th:action="@{/reset-password}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="token" th:value="${token}">
                    
                    <div class="mb-3">
                        <label class="form-label" for="password">Mật khẩu mới</label>
                        <input class="form-control" id="password" type="password" name="password" minlength="8" placeholder="Tối thiểu 8 ký tự" required autofocus>
                    </div>
                    
                    <button class="btn btn-primary w-100 py-2 fw-semibold" type="submit">Xác nhận đổi mật khẩu</button>
                </form>

                <div class="mt-4 pt-3 border-top text-center">
                    <a th:href="@{/login}" class="small text-muted text-decoration-none">← Quay lại đăng nhập</a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout/main :: footer}"></footer>
</body>
</html>
