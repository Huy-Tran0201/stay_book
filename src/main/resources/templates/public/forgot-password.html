<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head('Quên mật khẩu')}"></head>
<body>
<nav th:replace="~{layout/main :: header}"></nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5 col-xl-4">
            <div class="card p-4 p-md-4 border-0 shadow-sm" style="border: 1px solid var(--sb-border) !important;">
                <div class="text-center mb-4">
                    <h1 class="h4 fw-bold text-dark">Quên mật khẩu</h1>
                    <p class="text-muted small">Nhập địa chỉ email của bạn để nhận liên kết khôi phục</p>
                </div>

                <div class="alert alert-success border-0 small py-2 mb-3" th:if="${param.sent}">
                    Nếu email tồn tại trong hệ thống, liên kết đặt lại mật khẩu đã được tạo.
                </div>

                <form method="post" th:action="@{/forgot-password}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="mb-3">
                        <label class="form-label" for="email">Địa chỉ Email</label>
                        <input class="form-control" id="email" type="email" name="email" placeholder="email@example.com" required autofocus>
                    </div>
                    <button class="btn btn-primary w-100 py-2 fw-semibold" type="submit">Gửi liên kết khôi phục</button>
                </form>

                <div class="mt-4 pt-3 border-top text-center">
                    <a th:href="@{/login}" class="small text-muted text-decoration-none">← Quay lại đăng nhập</a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout/main :: footer}"></footer>
</body>
</html>
