<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head('Quên mật khẩu')}"></head><body>
<nav th:replace="~{layout/main :: header}"></nav><main class="container py-5"><div class="card mx-auto" style="max-width:420px"><div class="card-body">
<h1 class="h3">Quên mật khẩu</h1><div class="alert alert-success" th:if="${param.sent}">Nếu email tồn tại, liên kết đặt lại đã được gửi.</div>
<form method="post"><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required><button class="btn btn-primary">Gửi liên kết</button></form>
</div></div></main><footer th:replace="~{layout/main :: footer}"></footer></body></html>
